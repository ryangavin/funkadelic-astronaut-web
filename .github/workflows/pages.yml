name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test site behavior
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Stage static website
        run: |
          mkdir _site
          cp index.html press-kit.html style.css app.js typography-debug.js ribbon-editor.js living-video.js poster-motion.js portrait-strip.js cutout-type.js _site/
          cp -R assets _site/assets
          cp -R styles _site/styles
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
