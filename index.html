<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121420" />
    <meta
      name="description"
      content="Funkadelic Astronaut — New Jersey future rock. Press kit: bio, the band, music, a live video and booking."
    />
    <!-- Share previews. X reads the og: title, description and image when it has no twitter: ones of its own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Funkadelic Astronaut" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Funkadelic Astronaut — Press kit" />
    <meta property="og:description" content="New Jersey future rock trio. Bio, music, live video and booking." />
    <meta property="og:url" content="https://funkadelicastronaut.com/" />
    <!-- public/share.jpg, made by scripts/generate-icons.mjs from assets/performance.jpg. -->
    <meta property="og:image" content="https://funkadelicastronaut.com/share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Funkadelic Astronaut on stage under blue light, with drums and keyboards" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Funkadelic Astronaut on stage under blue light, with drums and keyboards" />
    <link rel="canonical" href="https://funkadelicastronaut.com/" />
    <!-- Icons and the web app manifest, made by scripts/generate-icons.mjs from the astronaut artwork. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The band's schema.org MusicGroup (JSON-LD) is added to the head from src/content by scripts/structured-data.mts. -->
    <title>Funkadelic Astronaut — Press kit</title>
    <style>
      body { margin: 0; background: #121420; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
